name: Frontend Typecheck

# Gate tipe: tanpa job ini error `vue-tsc` bisa menumpuk tanpa terlihat
# (kejadian DFORM-40: 278 error akumulatif karena tidak ada yang menjalankannya).
on:
    push:
        branches:
            - main
            - dev
            - temp
    pull_request:
        branches:
            - main
            - dev
            - temp

jobs:
    typecheck:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Typecheck (vue-tsc)
              run: npm run typecheck
